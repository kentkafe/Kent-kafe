<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kent Kafe | Bakımdayız</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a2f1d;
    --bg-dark: #062013;
    --gold: #d4af37;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #ffffff;
    position: relative;
  }

  /* Yumuşak hareket eden arka plan katmanı */
  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(212,175,55,0.12), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06), transparent 40%),
      linear-gradient(135deg, var(--bg) 0%, var(--bg-dark) 100%);
    animation: drift 12s ease-in-out infinite alternate;
  }

  @keyframes drift {
    0%   { transform: scale(1) translate(0,0); }
    100% { transform: scale(1.08) translate(-10px, 10px); }
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 30px;
    max-width: 480px;
  }

  .cup {
    font-size: 44px;
    margin-bottom: 18px;
    display: inline-block;
    animation: steamFloat 3s ease-in-out infinite;
  }

  @keyframes steamFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .brand {
    font-size: clamp(11pt, 4vw, 13pt);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    font-family: Arial, sans-serif;
    font-weight: bold;
    margin-bottom: 14px;
    opacity: 0.9;
  }

  h1 {
    font-size: clamp(20pt, 7vw, 30pt);
    font-weight: bold;
    letter-spacing: 1px;
    line-height: 1.35;
    margin-bottom: 18px;
  }

  .shimmer {
    background: linear-gradient(90deg, #ffffff 0%, #ffffff 40%, var(--gold) 50%, #ffffff 60%, #ffffff 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer {
    0%   { background-position: 200% center; }
    100% { background-position: -200% center; }
  }

  p.desc {
    font-family: Arial, sans-serif;
    font-size: 11pt;
    line-height: 1.7;
    color: rgba(255,255,255,0.85);
    margin-bottom: 26px;
  }

  .dots {
    display: inline-flex;
    gap: 8px;
    margin-bottom: 30px;
  }

  .dots span {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.3;
    animation: pulse 1.4s ease-in-out infinite;
  }

  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40%           { opacity: 1;    transform: scale(1.15); }
  }

  .divider {
    width: 60px;
    height: 2px;
    background: rgba(255,255,255,0.25);
    margin: 0 auto 24px auto;
  }

  .contact {
    font-family: Arial, sans-serif;
    font-size: 9.5pt;
    color: rgba(255,255,255,0.65);
    line-height: 1.8;
  }

  .contact a {
    color: var(--gold);
    text-decoration: none;
    font-weight: bold;
  }
</style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="content">
    <div class="cup">☕</div>
    <div class="brand">Kent Kafe</div>
    <h1 class="shimmer">Sitemiz Bakımdadır</h1>
    <p class="desc">
      Size daha iyi bir deneyim sunmak için üzerinde çalışıyoruz.
      Kısa süre içinde yeniden yanınızdayız.
    </p>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="divider"></div>
    <div class="contact">
      Canbalı, Atatürk Kültür Parkı, Karacabey/Bursa<br>
      <a href="tel:+902246768640">0224 676 86 40</a>
    </div>
  </div>

</body>
</html>
